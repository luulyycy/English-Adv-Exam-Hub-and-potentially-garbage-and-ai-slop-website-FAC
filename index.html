        // Calculate Total Practice Items for Progress Bar
        function countTotalPracticeItems() {
            totalPracticeItemsCount = 0;
            Object.keys(syllabusData).forEach(cat => {
                if (syllabusData[cat].practice) {
                    totalPracticeItemsCount += syllabusData[cat].practice.length;
                }
            });
            document.getElementById('progress-total-display').innerText = totalPracticeItemsCount;
        }

        // Theme Toggle Logic
        function initThemeToggle() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');

            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
                lightIcon.classList.apply ? lightIcon.classList.add('hidden') : null;
            }

            themeToggleBtn.addEventListener('click', () => {
                darkIcon.classList.toggle('hidden');
                lightIcon.classList.toggle('hidden');
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            });
        }

        // Switch Category Tabs
        function switchCategory(catKey) {
            currentCategory = catKey;

            // Update top bar active state
            document.querySelectorAll('.cat-nav-btn').forEach(btn => {
                btn.classList.remove('active-cat', 'border-brand-600', 'dark:border-brand-400', 'text-brand-600', 'dark:text-brand-400', 'font-semibold');
                btn.classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
            });
            const activeBtn = document.getElementById(`cat-btn-${catKey}`);
            if (activeBtn) {
                activeBtn.classList.add('active-cat', 'border-brand-600', 'dark:border-brand-400', 'text-brand-600', 'dark:text-brand-400', 'font-semibold');
                activeBtn.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
            }

            // Update Meta header
            const meta = syllabusData[catKey];
            document.getElementById('active-topic-title').innerText = meta.title;
            document.getElementById('active-topic-pages').innerText = meta.pages;
            document.getElementById('active-topic-badge').innerText = meta.badge;

            renderContent();
        }

            currentPillar = pillarKey;

            document.querySelectorAll('.pillar-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-brand-600', 'dark:text-brand-400', 'shadow-sm', 'font-bold');

                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white">Exam Practice Exercises</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400">Complete exercises to test your textbook mastery and accumulate score points.</p>
                        </div>
                        <button onclick="resetCategoryQuiz()" class="text-xs text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 underline font-medium">Reset Section</button>
                    </div>
                    ${questionsHtml}
                </div>
            `;
        }

        // Check MCQ Answers
        function checkMCQ(qId, selectedIdx, correctIdx) {
            const data = syllabusData[currentCategory].practice.find(q => q.id === qId);
            const feedbackEl = document.getElementById(`feedback-${qId}`);

            document.querySelectorAll(`.opt-btn-${qId}`).forEach((btn, i) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-50', 'dark:hover:bg-slate-750');
                if (i === correctIdx) {
                    btn.classList.add('bg-emerald-50', 'dark:bg-emerald-950/40', 'border-emerald-500', 'text-emerald-900', 'dark:text-emerald-200');
                    btn.querySelector('.indicator-icon').className = 'fa-solid fa-circle-check text-emerald-500';
                } else if (i === selectedIdx) {
                    btn.classList.add('bg-rose-50', 'dark:bg-rose-950/40', 'border-rose-500', 'text-rose-900', 'dark:text-rose-200');
                    btn.querySelector('.indicator-icon').className = 'fa-solid fa-circle-xmark text-rose-500';
                }
            });

            feedbackEl.classList.remove('hidden');
            if (selectedIdx === correctIdx) {
                feedbackEl.className = 'p-4 rounded-xl text-xs leading-relaxed font-medium bg-emerald-100 dark:bg-emerald-950/60 border border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200';
                feedbackEl.innerHTML = `<i class="fa-solid fa-check text-emerald-600 mr-1.5"></i> <strong>Correct!</strong> ${data.explanation}`;
                markCompleted(qId, 10);
            } else {
                feedbackEl.className = 'p-4 rounded-xl text-xs leading-relaxed font-medium bg-rose-100 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200';
                feedbackEl.innerHTML = `<i class="fa-solid fa-xmark text-rose-600 mr-1.5"></i> <strong>Incorrect.</strong> ${data.explanation}`;
                markCompleted(qId, 0);
            }
        }

        // Check Input / Transformation Answers
        function checkInputQuestion(qId, correctAnswer) {
            const inputVal = document.getElementById(`input-${qId}`).value.trim();
            const feedbackEl = document.getElementById(`feedback-${qId}`);
            const data = syllabusData[currentCategory].practice.find(q => q.id === qId);

            if (!inputVal) return;

            feedbackEl.classList.remove('hidden');

            const isCorrect = inputVal.toLowerCase() === correctAnswer.toLowerCase();
            if (isCorrect) {
                feedbackEl.className = 'p-4 rounded-xl text-xs leading-relaxed font-medium bg-emerald-100 dark:bg-emerald-950/60 border border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200';
                feedbackEl.innerHTML = `<i class="fa-solid fa-check text-emerald-600 mr-1.5"></i> <strong>Correct Answer!</strong> ${data.explanation}`;
                markCompleted(qId, 10);
            } else {
                feedbackEl.className = 'p-4 rounded-xl text-xs leading-relaxed font-medium bg-rose-100 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200';
                feedbackEl.innerHTML = `<i class="fa-solid fa-xmark text-rose-600 mr-1.5"></i> <strong>Expected:</strong> "${correctAnswer}". ${data.explanation}`;
                markCompleted(qId, 0);
            }
        }

        // Writing Outline Validation
        function checkWritingOutline(qId) {
            const text = document.getElementById(`input-${qId}`).value.trim();
            const feedbackEl = document.getElementById(`feedback-${qId}`);

            if (text.length < 15) {
                feedbackEl.classList.remove('hidden');
                feedbackEl.className = 'p-3.5 rounded-xl text-xs bg-amber-100 dark:bg-amber-950/60 border border-amber-300 text-amber-900 dark:text-amber-200';
                feedbackEl.innerHTML = '<i class="fa-solid fa-exclamation mr-1"></i> Please type out your outline points first before evaluating.';
                return;
            }

            feedbackEl.classList.remove('hidden');
            feedbackEl.className = 'p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 text-xs space-y-2 text-emerald-900 dark:text-emerald-200';
            feedbackEl.innerHTML = `
                <div class="font-bold flex items-center space-x-1.5">
                    <i class="fa-solid fa-circle-check text-emerald-500"></i>
                    <span>Outline Checked (+15 pts)</span>
                </div>
                <p><strong>Evaluation Criteria:</strong></p>
                <ul class="list-disc list-inside space-y-1 text-slate-700 dark:text-slate-300">
                    <li>Intro paraphrase & stance explicitly defined.</li>
                    <li>Balanced supporting arguments formatted with cohesive devices.</li>
                </ul>
            `;
            markCompleted(qId, 15);
        }

        // Global Progress Tracker
        function markCompleted(qId, pts) {
            if (!completedQuestions.has(qId)) {
                completedQuestions.add(qId);
                globalScore += pts;

                document.getElementById('global-score-display').innerText = globalScore;
                document.getElementById('progress-count-display').innerText = completedQuestions.size;

                const percent = (completedQuestions.size / totalPracticeItemsCount) * 100;
                document.getElementById('progress-bar-fill').style.width = `${percent}%`;
            }
        }

        // Reset Quiz for Active Category
        function resetCategoryQuiz() {
            renderContent();
        }
    </script>
</body>
</html>
